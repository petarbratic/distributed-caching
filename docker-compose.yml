services:
  gateway-1:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      BACKEND_URL: http://backend:8081
      INSTANCE_NAME: gateway-1
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - cache-net

  gateway-2:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      BACKEND_URL: http://backend:8081
      INSTANCE_NAME: gateway-2
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - cache-net

  load-balancer:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway-1:
        condition: service_started
      gateway-2:
        condition: service_started
    networks:
      - cache-net
    

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8081:8081"
    networks:
      - cache-net
  
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      - load-balancer
    networks:
      - cache-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - cache-net
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - gateway-1
      - gateway-2
      - backend
    networks:
      - cache-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - cache-net


networks:
  cache-net:
    name: cache-net
    driver: bridge