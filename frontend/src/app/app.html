<h1>Distributed caching</h1>
<input [(ngModel)]="id" placeholder="Type ID" />
<button (click)="load()">Call API</button>

<main class="container">
    <h1>System Configuration</h1>

    <p>
        Changing the configuration will clear all existing data from L1 and L2 caches.
    </p>

    <form #cacheForm="ngForm" (ngSubmit)="saveCacheConfig()">
        <div class="form-group">
            <label for="l1MaxEntries">
                Maximum number of elements in L1 cache
            </label>

            <input id="l1MaxEntries" name="l1MaxEntries" type="number" min="1" required
                [(ngModel)]="cacheConfig.l1MaxEntries" />
        </div>

        <div class="form-group">
            <label for="l2MaxEntries">
                Maximum number of elements in L2 cache
            </label>

            <input id="l2MaxEntries" name="l2MaxEntries" type="number" min="1" required
                [(ngModel)]="cacheConfig.l2MaxEntries" />
        </div>

        <div class="form-group">
            <label for="l1TTLSeconds">
                L1 TTL in seconds
            </label>

            <input id="l1TTLSeconds" name="l1TTLSeconds" type="number" min="1" required
                [(ngModel)]="cacheConfig.l1TTLSeconds" />
        </div>

        <div class="form-group">
            <label for="l2TTLSeconds">
                L2 TTL in seconds
            </label>

            <input id="l2TTLSeconds" name="l2TTLSeconds" type="number" min="1" required
                [(ngModel)]="cacheConfig.l2TTLSeconds" />
        </div>

        <div class="form-group">
            <label for="semaphoreSize">
                Maximum number of concurrent backend requests
            </label>

            <input id="semaphoreSize" name="semaphoreSize" type="number" min="1" required
                [(ngModel)]="cacheConfig.semaphoreSize" />
        </div>

        <div class="form-group">
            <label for="concurrentDelayMs">
                Delay per concurrent backend request in milliseconds
            </label>

            <input id="concurrentDelayMs" type="number" min="0" name="concurrentDelayMs" required
                [(ngModel)]="cacheConfig.concurrentDelayMs" />
        </div>

        <div class="form-group">
            <label for="baseLatencyMs">
                Base backend latency in milliseconds
            </label>

            <input id="baseLatencyMs" type="number" min="0" name="baseLatencyMs" required
                [(ngModel)]="cacheConfig.baseLatencyMs" />
        </div>

        <!-- SingleFlight Enabled -->
        <div class="form-group checkbox-group">
            <label for="singleFlightEnabled">
                Enable SingleFlight (Request Coalescing)
            </label>

            <input id="singleFlightEnabled" name="singleFlightEnabled" type="checkbox"
                [(ngModel)]="cacheConfig.singleFlightEnabled" />
        </div>

        <!-- Distributed Lock Enabled -->
        <div class="form-group checkbox-group">
            <label for="distributedLockEnabled">
                Enable distributed lock
            </label>

            <input id="distributedLockEnabled" name="distributedLockEnabled" type="checkbox"
                [(ngModel)]="cacheConfig.distributedLockEnabled" />
        </div>

        <!-- Probabilistic Early Refresh Enabled -->
        <div class="form-group checkbox-group">
            <label for="probabilisticEarlyRefreshEnabled">
                Enable probabilistic early refresh
            </label>

            <input id="probabilisticEarlyRefreshEnabled" name="probabilisticEarlyRefreshEnabled" type="checkbox"
                [(ngModel)]="
            cacheConfig.probabilisticEarlyRefreshEnabled
        " />
        </div>

        <!-- Early Refresh Beta -->
        <div class="form-group">
            <label for="earlyRefreshBeta">
                Probabilistic early refresh beta
            </label>

            <input id="earlyRefreshBeta" name="earlyRefreshBeta" type="number" min="0.1" max="10" step="0.1" required
                [(ngModel)]="cacheConfig.earlyRefreshBeta" />
        </div>

        <!-- Backend Timeout (ms) -->
        <div class="form-group">
            <label for="backendTimeoutMs">
                Backend timeout in milliseconds
            </label>

            <input id="backendTimeoutMs" name="backendTimeoutMs" type="number" min="1" required
                [(ngModel)]="cacheConfig.backendTimeoutMs" />
        </div>

        <!-- Adaptive TTL Enabled -->
        <div class="form-group checkbox-group">
            <label for="adaptiveTTLEnabled">
                Enable adaptive TTL
            </label>

            <input id="adaptiveTTLEnabled" name="adaptiveTTLEnabled" type="checkbox"
                [(ngModel)]="cacheConfig.adaptiveTTLEnabled" />
        </div>

        <!-- Adaptive TTL Minimum Factor -->
        <div class="form-group">
            <label for="adaptiveTTLMinFactor">
                Adaptive TTL minimum factor
            </label>

            <input id="adaptiveTTLMinFactor" name="adaptiveTTLMinFactor" type="number" min="0.1" max="1" step="0.05" required
                [(ngModel)]="cacheConfig.adaptiveTTLMinFactor" />
        </div>

        <!-- Adaptive TTL Maximum Factor -->
        <div class="form-group">
            <label for="adaptiveTTLMaxFactor">
                Adaptive TTL maximum factor
            </label>

            <input id="adaptiveTTLMaxFactor" name="adaptiveTTLMaxFactor" type="number" min="1" step="0.1" required
                [(ngModel)]="cacheConfig.adaptiveTTLMaxFactor" />
        </div>

        <!-- Adaptive TTL Latency Threshold -->
        <div class="form-group">
            <label for="adaptiveTTLLatencyThresholdMs">
                Adaptive TTL p99 latency threshold in milliseconds
            </label>

            <input id="adaptiveTTLLatencyThresholdMs" name="adaptiveTTLLatencyThresholdMs" type="number" min="1"
                required [(ngModel)]="
                    cacheConfig.adaptiveTTLLatencyThresholdMs
                " />
        </div>

        <!-- Adaptive TTL Concurrency Threshold -->
        <div class="form-group">
            <label for="adaptiveTTLConcurrencyThreshold">
                Adaptive TTL concurrent requests threshold
            </label>

            <input id="adaptiveTTLConcurrencyThreshold" name="adaptiveTTLConcurrencyThreshold" type="number" min="1"
                required [(ngModel)]="
                    cacheConfig.adaptiveTTLConcurrencyThreshold
                " />
        </div>

        <!-- Adaptive TTL Adjustment Interval -->
        <div class="form-group">
            <label for="adaptiveTTLAdjustmentIntervalMs">
                Adaptive TTL adjustment interval in milliseconds
            </label>

            <input id="adaptiveTTLAdjustmentIntervalMs" name="adaptiveTTLAdjustmentIntervalMs" type="number" min="1"
                required [(ngModel)]="
                    cacheConfig.adaptiveTTLAdjustmentIntervalMs
                " />
        </div>

        <p class="validation-error" *ngIf="
        cacheConfig.l1MaxEntries > 0 &&
        cacheConfig.l2MaxEntries > 0 &&
        cacheConfig.l1MaxEntries > cacheConfig.l2MaxEntries
      ">
            L1 size cannot be greater than L2 size.
        </p>

        <button type="submit" [disabled]="
        loading ||
        cacheForm.invalid ||
        cacheConfig.l1MaxEntries > cacheConfig.l2MaxEntries
      ">
            {{ loading ? 'Saving...' : 'Save configuration' }}
        </button>
    </form>

    <p class="success-message" *ngIf="successMessage">
        {{ successMessage }}
    </p>

    <p class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
    </p>
</main>
